<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Início — Lilly 360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&display=swap" />
    <link rel="stylesheet" href="styles.css?v=85" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor" stroke="none" /></symbol>
        <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" /></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13" /><path d="M22 2 15 22l-4-9-9-4z" /></symbol>
        <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" /></symbol>
        <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4" /></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v6M12 7.5v.5" /></symbol>
        <symbol id="i-medal" viewBox="0 0 24 24"><circle cx="12" cy="15" r="6" /><path d="M8.5 10 6 2h4l2 5 2-5h4l-2.5 8" /></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" /><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" /></symbol>
        <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z" /><path d="m2 17 10 5 10-5M2 12l10 5 10-5" /></symbol>
        <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" /></symbol>
        <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 7-10 6L2 7" /></symbol>
        <symbol id="i-calc" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" /><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15v3M8 18h4" /></symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" /></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z" /><path d="M3.2 12h4.3l1.5-3 3 6 1.5-3h7.3" /></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z" /><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z" /></symbol>
        <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></symbol>
      </defs>
    </svg>

    <a class="skip-link" href="#app">Pular para o conteúdo</a>

    <header class="site-header on-dark">
      <div class="container">
        <div class="pill nav-pill" id="nav-pill">
          <div class="nav-top">
            <a class="wordmark" href="#/inicio" aria-label="Lilly 360, início">
              <img class="wordmark-logo" src="assets/lilly-logo.svg" alt="" width="54" height="30" />
              <span class="wordmark-suffix" aria-hidden="true">360</span>
            </a>
            <button class="icon-button nav-toggle" type="button" aria-expanded="false" aria-controls="nav-panel" aria-label="Abrir navegação">
              <svg class="nav-toggle-open" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><use href="#i-menu" /></svg>
              <svg class="nav-toggle-close" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><use href="#i-close" /></svg>
            </button>
          </div>
          <div class="nav-panel" id="nav-panel"></div>
        </div>

        <div class="pill pill-right">
          <button class="icon-button" type="button" data-action="notificacoes" aria-label="Notificações, 1 nova">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-bell" /></svg>
            <span class="dot" aria-hidden="true"></span>
          </button>
          <a class="avatar" href="#/voce" data-nav="voce" aria-label="Você: Dr. Paulo Ferreira, Cardiologia">PF</a>
          <button class="header-entrar" type="button" data-action="login-abrir">Entrar</button>
        </div>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <div class="sheet-root" id="sheet-root"></div>

    <aside class="backstage" id="backstage" aria-label="Bastidores: por que a plataforma mostra cada item" hidden>
      <div class="backstage-head">
        <p class="eyebrow">Bastidores</p>
        <button class="backstage-close" type="button" data-proto="bastidores" aria-label="Fechar bastidores">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="backstage-body" id="backstage-body"></div>
    </aside>

    <div class="protobar" role="region" aria-label="Controles do protótipo">
      <div class="protobar-row">
        <span class="proto-label">Protótipo</span>
        <label class="proto-field">
          <span class="visually-hidden">Fluxo</span>
          <select id="proto-flow">
            <option value="0">Navegação livre</option>
            <option value="1">1. Da busca ao paciente</option>
            <option value="3">2. Da live perdida ao replay</option>
            <!-- Oculto por enquanto. Para reativar, descomente e remova "oculto" de FLOWS[4] em app.js.
            <option value="4">3. Do congresso à consulta</option> -->
            <option value="5">3. Do estudo ao reconhecimento</option>
          </select>
        </label>
        <div class="proto-seg" role="group" aria-label="Dia simulado">
          <button type="button" data-proto="dia" data-dia="seg" aria-pressed="true">Segunda</button>
          <button type="button" data-proto="dia" data-dia="ter" aria-pressed="false">Terça</button>
        </div>
        <p class="proto-hint" id="proto-hint" aria-live="polite"></p>
        <span class="proto-stat" id="proto-touches"></span>
        <div class="proto-seg" role="group" aria-label="Home simulada">
          <button type="button" data-proto="home" data-home="recorrente" aria-pressed="true">Recorrente</button>
          <button type="button" data-proto="home" data-home="primeiro" aria-pressed="false">Primeiro acesso</button>
          <button type="button" data-proto="home" data-home="externo" aria-pressed="false">Via ChatGPT</button>
        </div>
        <button class="proto-button" type="button" data-proto="reiniciar">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-reset" /></svg>
          Reiniciar
        </button>
      </div>
    </div>

    <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>

    <script src="app.js?v=75"></script>
  </body>
</html>
